{% extends 'base.html' %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}

<div class="login-page">

    <header class="login-header">
        <h1 class="login-title animate__animated animate__fadeInDown">
            Iniciar sesión
        </h1>
        <p class="login-intro">
            Ingresá con tu cuenta para acceder a los servicios de Servicio PC.
        </p>
    </header>

    <section class="login-section">

        <div class="card login-card">
            <div class="card-body login-card-body">

                <form method="post">
                    {% csrf_token %}

                    <div class="login-fields">
                        {{ form.as_p }}
                    </div>

                    <button type="submit" class="btn btn-primary login-submit">
                        <i class="bi bi-box-arrow-in-right"></i>
                        Entrar
                    </button>
                </form>

                <p class="login-register">
                    ¿No tenés cuenta?
                    <a href="{% url 'accounts:registro' %}">Registrate</a>
                </p>

            </div>
        </div>

    </section>

</div>

{% endblock %}
