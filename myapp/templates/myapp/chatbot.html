<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente Virtual - Servicio Técnico</title>


    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }


        .chat-container {
            width: 100%;
            max-width: 430px;
            height: 650px;
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
        }


        .chat-header {
            background: #173b65;
            color: white;
            padding: 22px;
            display: flex;
            align-items: center;
            gap: 12px;
        }


        .avatar {
            background: #2e83d5;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
        }


        .chat-header h2 {
            font-size: 17px;
            margin-bottom: 5px;
        }


        .chat-header p {
            font-size: 12px;
            color: #c9dced;
        }


        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: #f8fafc;
        }


        .message {
            max-width: 85%;
            padding: 12px 15px;
            border-radius: 13px;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }


        .bot-message {
            background: #e5edf7;
            color: #1e293b;
            align-self: flex-start;
            border-bottom-left-radius: 3px;
        }


        .user-message {
            background: #2468ad;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 3px;
        }


        .chat-input-area {
            display: flex;
            gap: 10px;
            padding: 15px;
            border-top: 1px solid #e5e7eb;
        }


        .chat-input-area input {
            flex: 1;
            min-width: 0;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            outline: none;
            font-size: 14px;
        }




        .chat-input-area input:focus {
            border-color: #2468ad;
        }


        .chat-input-area button {
            background: #2468ad;
            color: white;
            border: none;
            border-radius: 9px;
            padding: 0 18px;
            cursor: pointer;
            font-weight: bold;
        }


        .chat-input-area button:hover {
            background: #174c83;
        }


        .chat-input-area button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }


        .typing {
            color: #64748b;
            font-size: 12px;
            font-style: italic;
            align-self: flex-start;
        }


        .chat-footer {
            text-align: center;
            font-size: 11px;
            color: #94a3b8;
            padding: 8px;
        }
    </style>
</head>


<body>


    <div class="chat-container">


        <header class="chat-header">
            <div class="avatar">💻</div>


            <div>
                <h2>Servicio Técnico PC</h2>
                <p>Asistente virtual · En línea</p>
            </div>
        </header>


        <main class="chat-messages" id="chatMessages">


            <div class="message bot-message">
                ¡Hola! Bienvenido al servicio técnico.
                Soy el asistente virtual y puedo ayudarte
                con información sobre servicios, precios,
                reparaciones y políticas de atención.
                ¿En qué puedo ayudarte?
            </div>




        </main>


        <form class="chat-input-area" id="chatForm">
            <input
                type="text"
                id="userInput"
                placeholder="Escribí tu consulta..."
                autocomplete="off"
                required
            >


            <button type="submit" id="sendButton">
                Enviar
            </button>
        </form>


        <footer class="chat-footer">
            Asistente virtual · Servicio Técnico
        </footer>


    </div>


    <script>
        // URL del Webhook de n8n
        const WEBHOOK_URL = "https://leafiga.app.n8n.cloud/webhook/chat-reparaciones-figueroa-leandro";


        let sessionId = sessionStorage.getItem("chatSessionId");


        if (!sessionId) {
            sessionId = crypto.randomUUID();
            sessionStorage.setItem("chatSessionId", sessionId);
        }


        const chatMessages = document.getElementById("chatMessages");
        const chatForm = document.getElementById("chatForm");
        const userInput = document.getElementById("userInput");
        const sendButton = document.getElementById("sendButton");


        // Mostrar un mensaje en la conversación
        function mostrarMensaje(texto, tipo) {


            const mensaje = document.createElement("div");


            mensaje.classList.add("message");
            mensaje.classList.add(tipo === "usuario"
                ? "user-message"
                : "bot-message");


            // textContent evita interpretar el texto como HTML
            mensaje.textContent = texto;


            chatMessages.appendChild(mensaje);


            chatMessages.scrollTop = chatMessages.scrollHeight;
        }


        // Enviar pregunta al Webhook de n8n
        async function enviarPregunta(pregunta) {


            try {


                sendButton.disabled = true;


                const indicador = document.createElement("div");
                indicador.className = "typing";
                indicador.textContent = "El asistente está escribiendo...";


                chatMessages.appendChild(indicador);


                chatMessages.scrollTop = chatMessages.scrollHeight;


                const respuestaHTTP = await fetch(WEBHOOK_URL, {
                    method: "POST",


                    headers: {
                        "Content-Type": "application/json"
                    },


                    body: JSON.stringify({
                        pregunta: pregunta,
                        sessionId: sessionId
                    })
                   
                });


                if (!respuestaHTTP.ok) {
                    throw new Error("Error al comunicarse con el servidor.");
                }


                const datos = await respuestaHTTP.json();


                indicador.remove();
                mostrarMensaje(
                    datos.respuesta || "No se recibió una respuesta válida.",
                    "bot"
                );


            } catch (error) {


                const indicador = chatMessages.querySelector(".typing");


                if (indicador) {
                    indicador.remove();
                }


                console.error(error);
                mostrarMensaje(
                    "No pude conectarme con el asistente. Verificá tu conexión e intentá nuevamente.",
                    "bot"
                );


            } finally {
                sendButton.disabled = false;
                userInput.focus();
            }
        }


        // Evento de envío del formulario
        chatForm.addEventListener("submit", function(event) {


            event.preventDefault();


            const pregunta = userInput.value.trim();


            if (pregunta === "") {
                return;
            }
            mostrarMensaje(pregunta, "usuario");
            userInput.value = "";
            enviarPregunta(pregunta);
        });
    </script>


</body>
</html>
